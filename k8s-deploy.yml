apiVersion: apps/v1
kind: Deployment
metadata:
  name: timetable-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-timetable
  template:
    metadata:
      labels:
        app: student-timetable
    spec:
      containers:
      - name: timetable-container
        image: timetable-app:latest
        imagePullPolicy: Never # Crucial if building locally on Minikube/Docker Desktop
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: timetable-service
spec:
  type: NodePort
  selector:
    app: student-timetable
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007 
